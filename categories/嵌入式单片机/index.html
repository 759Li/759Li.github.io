n\u003cfigure class=\"highlight c\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"gutter\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e1\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e2\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e3\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e4\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003ctd class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"type\"\u003evoid\u003c/span\u003e \u003cspan class=\"title function_\"\u003einit74hc138\u003c/span\u003e\u003cspan class=\"params\"\u003e(\u003cspan class=\"type\"\u003eunsigned\u003c/span\u003e \u003cspan class=\"type\"\u003echar\u003c/span\u003e n)\u003c/span\u003e{\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    P2=(P2\u0026amp;\u003cspan class=\"number\"\u003e0x1f\u003c/span\u003e)|(n\u0026lt;\u0026lt;\u003cspan class=\"number\"\u003e5\u003c/span\u003e);\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    P2\u0026amp;=\u003cspan class=\"number\"\u003e0x1f\u003c/span\u003e;\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e}\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\n\u003cp\u003e而系统初始化函数 \u003ccode\u003einit()\u003c/code\u003e 负责关闭蜂鸣器、继电器并熄灭LED：\u003c/p\u003e\n\u003cfigure class=\"highlight c\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"gutter\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e1\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e2\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e3\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e4\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e5\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e6\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003ctd class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"type\"\u003evoid\u003c/span\u003e \u003cspan class=\"title function_\"\u003einit\u003c/span\u003e\u003cspan class=\"params\"\u003e()\u003c/span\u003e{\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    P0=\u003cspan class=\"number\"\u003e0x00\u003c/span\u003e;\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    init74hc138(\u003cspan class=\"number\"\u003e5\u003c/span\u003e);\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    P0=\u003cspan class=\"number\"\u003e0xff\u003c/span\u003e;\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    init74hc138(\u003cspan class=\"number\"\u003e4\u003c/span\u003e);\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e}\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\n\u003cp\u003e初始化的精准设置，为后续各个功能模块的稳定运行奠定了坚实基础。\u003c/p\u003e\n\u003ch2 id=\"二、按键（补充双按键与双击操作）\"\u003e\u003ca href=\"#二、按键（补充双按键与双击操作）\" class=\"headerlink\" title=\"二、按键（补充双按键与双击操作）\"\u003e\u003c/a\u003e二、按键（补充双按键与双击操作）\u003c/h2\u003e\u003cp\u003e在竞赛中，双按键联动与双击确认等操作可实现模式切换、功能重置、参数微调等高级功能，这些功能的实现依赖精确的状态检测与逻辑判断。\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/2024/02/20/%E5%B5%8C%E5%85%A5%E5%BC%8F%E5%8D%95%E7%89%87%E6%9C%BA/%E8%93%9D%E6%A1%A5%E6%9D%AF%E5%8D%95%E7%89%87%E6%9C%BA%E4%BB%A3%E7%A0%81%E7%BC%96%E5%86%99%E6%80%BB%E7%BB%93/0002_02.png\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"/2024/02/20/%E5%B5%8C%E5%85%A5%E5%BC%8F%E5%8D%95%E7%89%87%E6%9C%BA/%E8%93%9D%E6%A1%A5%E6%9D%AF%E5%8D%95%E7%89%87%E6%9C%BA%E4%BB%A3%E7%A0%81%E7%BC%96%E5%86%99%E6%80%BB%E7%BB%93/0002_03.png\"\u003e\u003c/p\u003e\n\u003ch3 id=\"（一）基础按键状态定义（通用）\"\u003e\u003ca href=\"#（一）基础按键状态定义（通用）\" class=\"headerlink\" title=\"（一）基础按键状态定义（通用）\"\u003e\u003c/a\u003e（一）基础按键状态定义（通用）\u003c/h3\u003e\u003cp\u003e为实现复杂按键操作，首先需定义一系列全局变量记录按键核心状态，为后续操作提供基础。以下以独立按键为例说明，矩阵按键可依相同原理类比扩展。\u003c/p\u003e\n\u003cfigure class=\"highlight c\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"gutter\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e1\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e2\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e3\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e4\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e5\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e6\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e7\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e8\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e9\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e10\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e11\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003ctd class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"comment\"\u003e// 按键核心状态变量（独立按键示例，矩阵按键可类比扩展）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003esbit S4 = P3^\u003cspan class=\"number\"\u003e3\u003c/span\u003e;  \u003cspan class=\"comment\"\u003e// 按键1\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003esbit S5 = P3^\u003cspan class=\"number\"\u003e2\u003c/span\u003e;  \u003cspan class=\"comment\"\u003e// 按键2（用于双按键操作）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"type\"\u003eunsigned\u003c/span\u003e \u003cspan class=\"type\"\u003echar\u003c/span\u003e keyVal = \u003cspan class=\"number\"\u003e0\u003c/span\u003e;    \u003cspan class=\"comment\"\u003e// 当前按键值（0：无按键，4：S4，5：S5，6：S4+S5双按）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"type\"\u003eunsigned\u003c/span\u003e \u003cspan class=\"type\"\u003echar\u003c/span\u003e keyOld = \u003cspan class=\"number\"\u003e0\u003c/span\u003e;    \u003cspan class=\"comment\"\u003e// 上一次按键值\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"type\"\u003eunsigned\u003c/span\u003e \u003cspan class=\"type\"\u003echar\u003c/span\u003e keyDown = \u003cspan class=\"number\"\u003e0\u003c/span\u003e;   \u003cspan class=\"comment\"\u003e// 按键按下标志（仅按下瞬间置1）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"type\"\u003eunsigned\u003c/span\u003e \u003cspan class=\"type\"\u003echar\u003c/span\u003e keyUp = \u003cspan class=\"number\"\u003e0\u003c/span\u003e;     \u003cspan class=\"comment\"\u003e// 按键抬起标志（仅抬起瞬间置1）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"comment\"\u003e// 双击检测专用变量\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"type\"\u003eunsigned\u003c/span\u003e \u003cspan class=\"type\"\u003eint\u003c/span\u003e doubleClickTimer = \u003cspan class=\"number\"\u003e0\u003c/span\u003e;  \u003cspan class=\"comment\"\u003e// 双击计时（单位：ms，需定时器支持）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"type\"\u003eunsigned\u003c/span\u003e \u003cspan class=\"type\"\u003echar\u003c/span\u003e doubleClickFlag = \u003cspan class=\"number\"\u003e0\u003c/span\u003e;  \u003cspan class=\"comment\"\u003e// 双击成功标志（1：双击触发）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"type\"\u003eunsigned\u003c/span\u003e \u003cspan class=\"type\"\u003echar\u003c/span\u003e clickCount = \u003cspan class=\"number\"\u003e0\u003c/span\u003e;       \u003cspan class=\"comment\"\u003e// 按键按下次数（1次：单按，2次：双击）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\n\n\u003ch3 id=\"（二）双按键操作（独立按键）\"\u003e\u003ca href=\"#（二）双按键操作（独立按键）\" class=\"headerlink\" title=\"（二）双按键操作（独立按键）\"\u003e\u003c/a\u003e（二）双按键操作（独立按键）\u003c/h3\u003e\u003cp\u003e双按键操作的关键在于准确检测到两个按键同时按下的瞬间，并通过有效消抖逻辑排除按键先后按下的误判情况。此操作在实际应用中常用于模式切换、功能重置等场景，为系统提供更丰富交互方式。\u003c/p\u003e\n\u003ch4 id=\"1-双按键扫描（含消抖）\"\u003e\u003ca href=\"#1-双按键扫描（含消抖）\" class=\"headerlink\" title=\"1. 双按键扫描（含消抖）\"\u003e\u003c/a\u003e1. 双按键扫描（含消抖）\u003c/h4\u003e\u003cfigure class=\"highlight c\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"gutter\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e1\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e2\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e3\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e4\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e5\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e6\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e7\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e8\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e9\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e10\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e11\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e12\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e13\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e14\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e15\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e16\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e17\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e18\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e19\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e20\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e21\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003ctd class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"comment\"\u003e// 消抖函数（10ms延时，避免按键抖动误触发）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"type\"\u003eunsigned\u003c/span\u003e \u003cspan class=\"type\"\u003echar\u003c/span\u003e \u003cspan class=\"title function_\"\u003eKey_Debounce\u003c/span\u003e\u003cspan class=\"params\"\u003e(sbit key)\u003c/span\u003e {\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"type\"\u003eunsigned\u003c/span\u003e \u003cspan class=\"type\"\u003echar\u003c/span\u003e flag = \u003cspan class=\"number\"\u003e0\u003c/span\u003e;\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"keyword\"\u003eif\u003c/span\u003e (key == \u003cspan class=\"number\"\u003e0\u003c/span\u003e) {  \u003cspan class=\"comment\"\u003e// 检测到按键按下\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e        \u003cspan class=\"type\"\u003eunsigned\u003c/span\u003e \u003cspan class=\"type\"\u003eint\u003c/span\u003e delay = \u003cspan class=\"number\"\u003e1000\u003c/span\u003e;  \u003cspan class=\"comment\"\u003e// 约10ms延时（12MHz晶振）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e        \u003cspan class=\"keyword\"\u003ewhile\u003c/span\u003e (delay--);\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e        \u003cspan class=\"keyword\"\u003eif\u003c/span\u003e (key == \u003cspan class=\"number\"\u003e0\u003c/span\u003e) flag = \u003cspan class=\"number\"\u003e1\u003c/span\u003e;  \u003cspan class=\"comment\"\u003e// 消抖后仍按下，确认有效\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    }\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"keyword\"\u003ereturn\u003c/span\u003e flag;\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e}\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"comment\"\u003e// 双按键扫描函数：返回当前按键值（0：无，4：S4，5：S5，6：S4+S5）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"type\"\u003eunsigned\u003c/span\u003e \u003cspan class=\"type\"\u003echar\u003c/span\u003e \u003cspan class=\"title function_\"\u003eScanKey_Double\u003c/span\u003e\u003cspan class=\"params\"\u003e()\u003c/span\u003e {\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"type\"\u003eunsigned\u003c/span\u003e \u003cspan class=\"type\"\u003echar\u003c/span\u003e s4Stat = Key_Debounce(S4);\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"type\"\u003eunsigned\u003c/span\u003e \u003cspan class=\"type\"\u003echar\u003c/span\u003e s5Stat = Key_Debounce(S5);\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"keyword\"\u003eif\u003c/span\u003e (s4Stat \u0026amp;\u0026amp; s5Stat) \u003cspan class=\"keyword\"\u003ereturn\u003c/span\u003e \u003cspan class=\"number\"\u003e6\u003c/span\u003e;    \u003cspan class=\"comment\"\u003e// 双键同时按下\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"keyword\"\u003eelse\u003c/span\u003e \u003cspan class=\"keyword\"\u003eif\u003c/span\u003e (s4Stat) \u003cspan class=\"keyword\"\u003ereturn\u003c/span\u003e \u003cspan class=\"number\"\u003e4\u003c/span\u003e;         \u003cspan class=\"comment\"\u003e// 仅S4按下\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"keyword\"\u003eelse\u003c/span\u003e \u003cspan class=\"keyword\"\u003eif\u003c/span\u003e (s5Stat) \u003cspan class=\"keyword\"\u003ereturn\u003c/span\u003e \u003cspan class=\"number\"\u003e5\u003c/span\u003e;         \u003cspan class=\"comment\"\u003e// 仅S5按下\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"keyword\"\u003eelse\u003c/span\u003e \u003cspan class=\"keyword\"\u003ereturn\u003c/span\u003e \u003cspan class=\"number\"\u003e0\u003c/span\u003e;                     \u003cspan class=\"comment\"\u003e// 无按键\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e}\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\n\n\u003ch4 id=\"2-双按键状态处理\"\u003e\u003ca href=\"#2-双按键状态处理\" class=\"headerlink\" title=\"2. 双按键状态处理\"\u003e\u003c/a\u003e2. 双按键状态处理\u003c/h4\u003e\u003cp\u003e将双按键扫描和状态处理集成到原有的 \u003ccode\u003eKey_Loop\u003c/code\u003e 函数中，新增对双按键状态的判断及相应功能执行。\u003c/p\u003e\n\u003cfigure class=\"highlight c\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"gutter\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e1\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e2\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e3\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e4\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e5\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e6\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e7\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e8\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e9\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e10\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e11\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e12\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e13\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e14\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e15\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003ctd class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"type\"\u003evoid\u003c/span\u003e \u003cspan class=\"title function_\"\u003eKey_Loop\u003c/span\u003e\u003cspan class=\"params\"\u003e()\u003c/span\u003e {\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    keyVal = ScanKey_Double();  \u003cspan class=\"comment\"\u003e// 调用双按键扫描函数\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"comment\"\u003e// 计算按键按下/抬起标志\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    keyDown = keyVal \u0026amp; (keyOld ^ keyVal);  \u003cspan class=\"comment\"\u003e// 新按下瞬间置1\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    keyUp = ~keyVal \u0026amp; (keyOld ^ keyVal);   \u003cspan class=\"comment\"\u003e// 新抬起瞬间置1\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"comment\"\u003e// 双按键逻辑示例（可根据需求修改）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"keyword\"\u003eif\u003c/span\u003e (keyDown == \u003cspan class=\"number\"\u003e6\u003c/span\u003e) {  \u003cspan class=\"comment\"\u003e// 双键同时按下瞬间\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e        \u003cspan class=\"comment\"\u003e// 执行双键功能（如：系统重置、模式切换）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e        init();  \u003cspan class=\"comment\"\u003e// 调用初始化函数，关闭蜂鸣器/LED等\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    }\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    keyOld = keyVal;  \u003cspan class=\"comment\"\u003e// 更新上一次按键值\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e}\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\n\n\u003ch3 id=\"（三）按键双击检测（独立按键）\"\u003e\u003ca href=\"#（三）按键双击检测（独立按键）\" class=\"headerlink\" title=\"（三）按键双击检测（独立按键）\"\u003e\u003c/a\u003e（三）按键双击检测（独立按键）\u003c/h3\u003e\u003cp\u003e双击检测的核心在于通过精确计时判断两次按键按下之间的时间间隔，通常设定在300 - 500ms之间。为实现非阻塞计时，需借助1ms定时器完成。此操作常用于确认操作、参数微调等场景，进一步丰富人机交互方式。\u003c/p\u003e\n\u003ch4 id=\"1-定时器初始化（1ms中断，用于计时）\"\u003e\u003ca href=\"#1-定时器初始化（1ms中断，用于计时）\" class=\"headerlink\" title=\"1. 定时器初始化（1ms中断，用于计时）\"\u003e\u003c/a\u003e1. 定时器初始化（1ms中断，用于计时）\u003c/h4\u003e\u003cfigure class=\"highlight c\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"gutter\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e1\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e2\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e3\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e4\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e5\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e6\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e7\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e8\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e9\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e10\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e11\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e12\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e13\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e14\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e15\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e16\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e17\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e18\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e19\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003ctd class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"comment\"\u003e// 定时器0初始化（1ms@12MHz晶振，用于双击计时）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"type\"\u003evoid\u003c/span\u003e \u003cspan class=\"title function_\"\u003eTimer0_Init\u003c/span\u003e\u003cspan class=\"params\"\u003e()\u003c/span\u003e {\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    TMOD \u0026amp;= \u003cspan class=\"number\"\u003e0xF0\u003c/span\u003e;  \u003cspan class=\"comment\"\u003e// 清空定时器0模式\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    TMOD |= \u003cspan class=\"number\"\u003e0x01\u003c/span\u003e;  \u003cspan class=\"comment\"\u003e// 定时器0工作模式1（16位自动重装）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    TL0 = \u003cspan class=\"number\"\u003e0x66\u003c/span\u003e;    \u003cspan class=\"comment\"\u003e// 初值计算：1ms = (65536 - 1000*12) = 0xFC66\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    TH0 = \u003cspan class=\"number\"\u003e0xFC\u003c/span\u003e;\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    ET0 = \u003cspan class=\"number\"\u003e1\u003c/span\u003e;       \u003cspan class=\"comment\"\u003e// 使能定时器0中断\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    TR0 = \u003cspan class=\"number\"\u003e1\u003c/span\u003e;       \u003cspan class=\"comment\"\u003e// 启动定时器0\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    EA = \u003cspan class=\"number\"\u003e1\u003c/span\u003e;        \u003cspan class=\"comment\"\u003e// 使能总中断\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e}\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"comment\"\u003e// 定时器0中断服务函数（更新双击计时）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"type\"\u003evoid\u003c/span\u003e \u003cspan class=\"title function_\"\u003eTimer0_Isr\u003c/span\u003e\u003cspan class=\"params\"\u003e()\u003c/span\u003e interrupt 1 {\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    TL0 = \u003cspan class=\"number\"\u003e0x66\u003c/span\u003e;    \u003cspan class=\"comment\"\u003e// 重装初值\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    TH0 = \u003cspan class=\"number\"\u003e0xFC\u003c/span\u003e;\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"keyword\"\u003eif\u003c/span\u003e (doubleClickTimer \u0026lt; \u003cspan class=\"number\"\u003e500\u003c/span\u003e) {  \u003cspan class=\"comment\"\u003e// 计时上限500ms（双击间隔阈值）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e        doubleClickTimer++;\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    }\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e}\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\n\n\u003ch4 id=\"2-双击检测逻辑\"\u003e\u003ca href=\"#2-双击检测逻辑\" class=\"headerlink\" title=\"2. 双击检测逻辑\"\u003e\u003c/a\u003e2. 双击检测逻辑\u003c/h4\u003e\u003cp\u003e在 \u003ccode\u003eKey_Loop\u003c/code\u003e 函数中扩展对双击状态的处理逻辑，以实现准确的双击检测及相应功能触发。\u003c/p\u003e\n\u003cfigure class=\"highlight c\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"gutter\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e1\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e2\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e3\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e4\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e5\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e6\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e7\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e8\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e9\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e10\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e11\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e12\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e13\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e14\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e15\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e16\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e17\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e18\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e19\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e20\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e21\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e22\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e23\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e24\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e25\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e26\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e27\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e28\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e29\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e30\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003ctd class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"type\"\u003evoid\u003c/span\u003e \u003cspan class=\"title function_\"\u003eKey_Loop\u003c/span\u003e\u003cspan class=\"params\"\u003e()\u003c/span\u003e {\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    keyVal = ScanKey_Double();  \u003cspan class=\"comment\"\u003e// 基础扫描（此处以S4为例实现双击，可指定按键）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    keyDown = keyVal \u0026amp; (keyOld ^ keyVal);\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    keyUp = ~keyVal \u0026amp; (keyOld ^ keyVal);\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"comment\"\u003e// 双击检测核心逻辑（以S4按键为例）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"keyword\"\u003eif\u003c/span\u003e (keyDown == \u003cspan class=\"number\"\u003e4\u003c/span\u003e) {  \u003cspan class=\"comment\"\u003e// 检测到S4按下\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e        \u003cspan class=\"keyword\"\u003eif\u003c/span\u003e (clickCount == \u003cspan class=\"number\"\u003e0\u003c/span\u003e) {  \u003cspan class=\"comment\"\u003e// 第一次按下\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e            clickCount = \u003cspan class=\"number\"\u003e1\u003c/span\u003e;\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e            doubleClickTimer = \u003cspan class=\"number\"\u003e0\u003c/span\u003e;  \u003cspan class=\"comment\"\u003e// 重置计时\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e        } \u003cspan class=\"keyword\"\u003eelse\u003c/span\u003e \u003cspan class=\"keyword\"\u003eif\u003c/span\u003e (clickCount == \u003cspan class=\"number\"\u003e1\u003c/span\u003e \u0026amp;\u0026amp; doubleClickTimer \u0026lt;= \u003cspan class=\"number\"\u003e500\u003c/span\u003e) {  \u003cspan class=\"comment\"\u003e// 500ms内第二次按下\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e            clickCount = \u003cspan class=\"number\"\u003e0\u003c/span\u003e;\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e            doubleClickFlag = \u003cspan class=\"number\"\u003e1\u003c/span\u003e;  \u003cspan class=\"comment\"\u003e// 置位双击成功标志\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e        }\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    }\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"comment\"\u003e// 双击计时超时：500ms内未第二次按下，重置为单按状态\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"keyword\"\u003eif\u003c/span\u003e (clickCount == \u003cspan class=\"number\"\u003e1\u003c/span\u003e \u0026amp;\u0026amp; doubleClickTimer \u0026gt; \u003cspan class=\"number\"\u003e500\u003c/span\u003e) {\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e        clickCount = \u003cspan class=\"number\"\u003e0\u003c/span\u003e;\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e        doubleClickFlag = \u003cspan class=\"number\"\u003e0\u003c/span\u003e;\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    }\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"comment\"\u003e// 双击功能执行（根据标志触发）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"keyword\"\u003eif\u003c/span\u003e (doubleClickFlag == \u003cspan class=\"number\"\u003e1\u003c/span\u003e) {\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e        \u003cspan class=\"comment\"\u003e// 执行双击功能（如：参数确认、数值保存）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e        doubleClickFlag = \u003cspan class=\"number\"\u003e0\u003c/span\u003e;  \u003cspan class=\"comment\"\u003e// 重置标志，避免重复触发\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    }\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    keyOld = keyVal;\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e}\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\n\n\u003ch3 id=\"（四）矩阵按键的复杂操作扩展\"\u003e\u003ca href=\"#（四）矩阵按键的复杂操作扩展\" class=\"headerlink\" title=\"（四）矩阵按键的复杂操作扩展\"\u003e\u003c/a\u003e（四）矩阵按键的复杂操作扩展\u003c/h3\u003e\u003cp\u003e矩阵按键的双按键、双击逻辑与独立按键实现原理基本一致，仅扫描函数需依矩阵按键硬件连接修改。\u003c
