 class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"comment\"\u003e# 查看Samba版本\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003esmbd --version\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"comment\"\u003e# 检查服务状态（刚安装后默认未启动）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"built_in\"\u003esudo\u003c/span\u003e systemctl status smbd nmbd\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\n\u003cimg src=\"/2025/11/04/%E7%94%B5%E8%84%91%E8%AE%BE%E5%A4%87/Ubuntu%E7%B3%BB%E7%BB%9F%E6%90%AD%E5%BB%BASamba%E6%9C%8D%E5%8A%A1%E5%85%A8%E6%B5%81%E7%A8%8B%EF%BC%88%E6%89%93%E9%80%A0%E7%A7%81%E6%9C%89%E7%BD%91%E7%9B%98%EF%BC%89/0004_04.png\"\u003e\n\n\u003chr\u003e\n\u003ch2 id=\"三、配置共享目录\"\u003e\u003ca href=\"#三、配置共享目录\" class=\"headerlink\" title=\"三、配置共享目录\"\u003e\u003c/a\u003e三、配置共享目录\u003c/h2\u003e\u003ch3 id=\"1-创建共享目录\"\u003e\u003ca href=\"#1-创建共享目录\" class=\"headerlink\" title=\"1. 创建共享目录\"\u003e\u003c/a\u003e1. 创建共享目录\u003c/h3\u003e\u003cp\u003e选择空间充足的分区创建共享目录（这里以\u003ccode\u003e/data/storage/share\u003c/code\u003e为例）：\u003c/p\u003e\n\u003cfigure class=\"highlight bash\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"gutter\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e1\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e2\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e3\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e4\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e5\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e6\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e7\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e8\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003ctd class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"comment\"\u003e# 创建目录\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"built_in\"\u003esudo\u003c/span\u003e \u003cspan class=\"built_in\"\u003emkdir\u003c/span\u003e -p /data/storage/share\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"comment\"\u003e# 设置目录所有者（替换为当前用户名，如user）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"built_in\"\u003esudo\u003c/span\u003e \u003cspan class=\"built_in\"\u003echown\u003c/span\u003e -R \u003cspan class=\"variable\"\u003e$USER\u003c/span\u003e:\u003cspan class=\"variable\"\u003e$USER\u003c/span\u003e /data/storage/share\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"comment\"\u003e# 设置目录权限（确保读写权限）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"built_in\"\u003esudo\u003c/span\u003e \u003cspan class=\"built_in\"\u003echmod\u003c/span\u003e -R 775 /data/storage/share\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\n\u003cimg src=\"/2025/11/04/%E7%94%B5%E8%84%91%E8%AE%BE%E5%A4%87/Ubuntu%E7%B3%BB%E7%BB%9F%E6%90%AD%E5%BB%BASamba%E6%9C%8D%E5%8A%A1%E5%85%A8%E6%B5%81%E7%A8%8B%EF%BC%88%E6%89%93%E9%80%A0%E7%A7%81%E6%9C%89%E7%BD%91%E7%9B%98%EF%BC%89/0004_06.png\"\u003e\n\n\u003ch3 id=\"2-配置Samba共享规则\"\u003e\u003ca href=\"#2-配置Samba共享规则\" class=\"headerlink\" title=\"2. 配置Samba共享规则\"\u003e\u003c/a\u003e2. 配置Samba共享规则\u003c/h3\u003e\u003cp\u003e编辑Samba主配置文件：\u003c/p\u003e\n\u003cfigure class=\"highlight bash\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"gutter\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e1\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003ctd class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"built_in\"\u003esudo\u003c/span\u003e nano /etc/samba/smb.conf\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\n\u003cp\u003e在文件末尾添加如下共享配置（可根据实际情况修改）：\u003c/p\u003e\n\u003cfigure class=\"highlight ini\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"gutter\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e1\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e2\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e3\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e4\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e5\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e6\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e7\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e8\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e9\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e10\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e11\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e12\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e13\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e14\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e15\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e16\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e17\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003ctd class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"section\"\u003e[share]\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"comment\"\u003e# 共享名称（访问时显示）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"attr\"\u003ecomment\u003c/span\u003e = Private Cloud Storage\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"comment\"\u003e# 共享目录绝对路径\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"attr\"\u003epath\u003c/span\u003e = /data/storage/share\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"comment\"\u003e# 允许网络可见\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"attr\"\u003ebrowseable\u003c/span\u003e = \u003cspan class=\"literal\"\u003eyes\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"comment\"\u003e# 允许写入操作\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"attr\"\u003ewritable\u003c/span\u003e = \u003cspan class=\"literal\"\u003eyes\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"comment\"\u003e# 禁止匿名访问\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    guest \u003cspan class=\"attr\"\u003eok\u003c/span\u003e = \u003cspan class=\"literal\"\u003eno\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"comment\"\u003e# 允许访问的用户（替换为实际用户名）\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    valid \u003cspan class=\"attr\"\u003eusers\u003c/span\u003e = user\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"comment\"\u003e# 新建文件权限\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    create \u003cspan class=\"attr\"\u003emask\u003c/span\u003e = \u003cspan class=\"number\"\u003e0644\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    \u003cspan class=\"comment\"\u003e# 新建目录权限\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e    directory \u003cspan class=\"attr\"\u003emask\u003c/span\u003e = \u003cspan class=\"number\"\u003e0755\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\n\u003cp\u003e保存退出（\u003ccode\u003eCtrl+O\u003c/code\u003e → 回车 → \u003ccode\u003eCtrl+X\u003c/code\u003e）。\u003c/p\u003e\n\u003ch3 id=\"3-验证配置文件语法\"\u003e\u003ca href=\"#3-验证配置文件语法\" class=\"headerlink\" title=\"3. 验证配置文件语法\"\u003e\u003c/a\u003e3. 验证配置文件语法\u003c/h3\u003e\u003cp\u003e执行以下命令验证配置文件语法是否正确：\u003c/p\u003e\n\u003cfigure class=\"highlight bash\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"gutter\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e1\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003ctd class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003etestparm\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\n\u003cp\u003e若显示\u003ccode\u003eLoaded services file OK.\u003c/code\u003e，则表示配置正确。\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"四、创建Samba用户\"\u003e\u003ca href=\"#四、创建Samba用户\" class=\"headerlink\" title=\"四、创建Samba用户\"\u003e\u003c/a\u003e四、创建Samba用户\u003c/h2\u003e\u003cp\u003eSamba用户需基于系统已存在的用户，操作步骤如下：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e确认系统用户存在\u003c/strong\u003e（以\u003ccode\u003euser\u003c/code\u003e为例）：\u003cfigure class=\"highlight bash\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"gutter\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e1\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003ctd class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"built_in\"\u003eid\u003c/span\u003e user  \u003cspan class=\"comment\"\u003e# 输出用户ID信息表示存在\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e添加Samba用户并设置密码\u003c/strong\u003e：\u003cfigure class=\"highlight bash\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"gutter\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e1\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003ctd class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"built_in\"\u003esudo\u003c/span\u003e smbpasswd -a user\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\n输入并确认密码（与系统密码可不同）。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e验证用户添加成功\u003c/strong\u003e：\u003cfigure class=\"highlight bash\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"gutter\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e1\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003ctd class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003epdbedit -L  \u003cspan class=\"comment\"\u003e# 列出所有Samba用户，应包含user\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cimg src=\"/2025/11/04/%E7%94%B5%E8%84%91%E8%AE%BE%E5%A4%87/Ubuntu%E7%B3%BB%E7%BB%9F%E6%90%AD%E5%BB%BASamba%E6%9C%8D%E5%8A%A1%E5%85%A8%E6%B5%81%E7%A8%8B%EF%BC%88%E6%89%93%E9%80%A0%E7%A7%81%E6%9C%89%E7%BD%91%E7%9B%98%EF%BC%89/0004_09.png\"\u003e\n\n\u003chr\u003e\n\u003ch2 id=\"五、启动并配置Samba服务\"\u003e\u003ca href=\"#五、启动并配置Samba服务\" class=\"headerlink\" title=\"五、启动并配置Samba服务\"\u003e\u003c/a\u003e五、启动并配置Samba服务\u003c/h2\u003e\u003ch3 id=\"1-启动服务\"\u003e\u003ca href=\"#1-启动服务\" class=\"headerlink\" title=\"1. 启动服务\"\u003e\u003c/a\u003e1. 启动服务\u003c/h3\u003e\u003cp\u003e启动Samba的核心服务\u003ccode\u003esmbd\u003c/code\u003e（文件共享）和\u003ccode\u003enmbd\u003c/code\u003e（名称解析），并设置开机自启：\u003c/p\u003e\n\u003cfigure class=\"highlight bash\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"gutter\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e1\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e2\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e3\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e4\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e5\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003ctd class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"comment\"\u003e# 启动smbd和nmbd\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"built_in\"\u003esudo\u003c/span\u003e systemctl start smbd nmbd\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"comment\"\u003e# 设置开机自启\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"built_in\"\u003esudo\u003c/span\u003e systemctl \u003cspan class=\"built_in\"\u003eenable\u003c/span\u003e smbd nmbd\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\n\n\u003ch3 id=\"2-验证服务状态\"\u003e\u003ca href=\"#2-验证服务状态\" class=\"headerlink\" title=\"2. 验证服务状态\"\u003e\u003c/a\u003e2. 验证服务状态\u003c/h3\u003e\u003cp\u003e执行命令查看服务状态，需显示\u003ccode\u003eactive (running)\u003c/code\u003e：\u003c/p\u003e\n\u003cfigure class=\"highlight bash\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"gutter\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e1\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003ctd class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"built_in\"\u003esudo\u003c/span\u003e systemctl status smbd nmbd\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\n\u003cimg src=\"/2025/11/04/%E7%94%B5%E8%84%91%E8%AE%BE%E5%A4%87/Ubuntu%E7%B3%BB%E7%BB%9F%E6%90%AD%E5%BB%BASamba%E6%9C%8D%E5%8A%A1%E5%85%A8%E6%B5%81%E7%A8%8B%EF%BC%88%E6%89%93%E9%80%A0%E7%A7%81%E6%9C%89%E7%BD%91%E7%9B%98%EF%BC%89/0004_07.png\"\u003e\n\n\u003chr\u003e\n\u003ch2 id=\"六、配置防火墙\"\u003e\u003ca href=\"#六、配置防火墙\" class=\"headerlink\" title=\"六、配置防火墙\"\u003e\u003c/a\u003e六、配置防火墙\u003c/h2\u003e\u003ch3 id=\"1-放行Samba端口（UFW防火墙）\"\u003e\u003ca href=\"#1-放行Samba端口（UFW防火墙）\" class=\"headerlink\" title=\"1. 放行Samba端口（UFW防火墙）\"\u003e\u003c/a\u003e1. 放行Samba端口（UFW防火墙）\u003c/h3\u003e\u003cp\u003eSamba服务需要用到TCP的139和445端口，执行以下命令放行：\u003c/p\u003e\n\u003cfigure class=\"highlight bash\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"gutter\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e1\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e2\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e3\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e4\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e5\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e6\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e7\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e8\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e9\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003ctd class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"comment\"\u003e# 允许Samba所需端口\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"built_in\"\u003esudo\u003c/span\u003e ufw allow 139/tcp\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"built_in\"\u003esudo\u003c/span\u003e ufw allow 445/tcp\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"comment\"\u003e# 重新加载防火墙规则\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"built_in\"\u003esudo\u003c/span\u003e ufw reload\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"comment\"\u003e# 查看规则是否生效\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"built_in\"\u003esudo\u003c/span\u003e ufw status\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\n\u003cimg src=\"/2025/11/04/%E7%94%B5%E8%84%91%E8%AE%BE%E5%A4%87/Ubuntu%E7%B3%BB%E7%BB%9F%E6%90%AD%E5%BB%BASamba%E6%9C%8D%E5%8A%A1%E5%85%A8%E6%B5%81%E7%A8%8B%EF%BC%88%E6%89%93%E9%80%A0%E7%A7%81%E6%9C%89%E7%BD%91%E7%9B%98%EF%BC%89/0004_03.png\"\u003e\n\n\u003ch2 id=\"七、访问测试\"\u003e\u003ca href=\"#七、访问测试\" class=\"headerlink\" title=\"七、访问测试\"\u003e\u003c/a\u003e七、访问测试\u003c/h2\u003e\u003ch3 id=\"1-服务器本地测试\"\u003e\u003ca href=\"#1-服务器本地测试\" class=\"headerlink\" title=\"1. 服务器本地测试\"\u003e\u003c/a\u003e1. 服务器本地测试\u003c/h3\u003e\u003cp\u003e在服务器上本地连接共享，验证服务是否正常：\u003c/p\u003e\n\u003cfigure class=\"highlight bash\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"gutter\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e1\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e2\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003ctd class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"comment\"\u003e# 连接本地共享\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003esmbclient //localhost/share -U user\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/figure\u003e\n\u003cp\u003e输入密码后进入\u003ccode\u003esmb:\\\u0026gt;\u003c/code\u003e交互界面，说明服务正常。\u003c/p\u003e\n\u003cimg src=\"/2025/11/04/%E7%94%B5%E8%84%91%E8%AE%BE%E5%A4%87/Ubuntu%E7%B3%BB%E7%BB%9F%E6%90%AD%E5%BB%BASamba%E6%9C%8D%E5%8A%A1%E5%85%A8%E6%B5%81%E7%A8%8B%EF%BC%88%E6%89%93%E9%80%A0%E7%A7%81%E6%9C%89%E7%BD%91%E7%9B%98%EF%BC%89/0004_10.png\"\u003e\n\n\u003ch3 id=\"2-局域网设备访问\"\u003e\u003ca href=\"#2-局域网设备访问\" class=\"headerlink\" title=\"2. 局域网设备访问\"\u003e\u003c/a\u003e2. 局域网设备访问\u003c/h3\u003e\u003ch4 id=\"Windows系统\"\u003e\u003ca href=\"#Windows系统\" class=\"headerlink\" title=\"Windows系统\"\u003e\u003c/a\u003eWindows系统\u003c/h4\u003e\u003col\u003e\n\u003cli\u003e打开「文件资源管理器」，在地址栏输入：\u003ccode\u003e\\\\服务器内网IP\\share\u003c/code\u003e（例如\u003ccode\u003e\\\\192.168.1.10\\share\u003c/code\u003e）。\u003c/li\u003e\n\u003cli\u003e输入Samba用户名和密码，即可访问共享目录。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cimg src=\"/2025/11/04/%E7%94%B5%E8%84%91%E8%AE%BE%E5%A4%87/Ubuntu%E7%B3%BB%E7%BB%9F%E6%90%AD%E5%BB%BASamba%E6%9C%8D%E5%8A%A1%E5%85%A8%E6%B5%81%E7%A8%8B%EF%BC%88%E6%89%93%E9%80%A0%E7%A7%81%E6%9C%89%E7%BD%91%E7%9B%98%EF%BC%89/0004_08.png\"\u003e\n\n\u003ch4 id=\"手机设备（以ES文件浏览器为例）\"\u003e\u003ca href=\"#手机设备（以ES文件浏览器为例）\" class=\"headerlink\" title=\"手机设备（以ES文件浏览器为例）\"\u003e\u003c/a\u003e手机设备（以ES文件浏览器为例）\u003c/h4\u003e\u003col\u003e\n\u003cli\u003e打开APP → 「网络」→ 「SMB」→ 「新建连接」。\u003c/li\u003e\n\u003cli\u003e输入服务器IP、用户名、密码，连接后访问\u003ccode\u003eshare\u003c/code\u003e目录。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"3-外网访问配置（可选）\"\u003e\u003ca href=\"#3-外网访问配置（可选）\" class=\"headerlink\" title=\"3. 外网访问配置（可选）\"\u003e\u003c/a\u003e3. 外网访问配置（可选）\u003c/h3\u003e\u003cp\u003e通过路由器端口映射实现外网访问：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e登录路由器管理后台（例如\u003ccode\u003e192.168.1.1\u003c/code\u003e）。\u003c/li\u003e\n\u003cli\u003e添加端口映射规则，如下表：\u003c/li\u003e\n\u003c/ol\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e规则名称\u003c/th\u003e\n\u003cth\u003e内部IP\u003c/th\u003e\n\u003cth\u003e内部端口\u003c/th\u003e\n\u003cth\u003e外部端口\u003c/th\u003e\n\u003cth\u003e协议\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eSamba1\u003c/td\u003e\n\u003ctd\u003e192.168.1.10\u003c/td\u003e\n\u003ctd\u003e139\u003c/td\u003e\n\u003ctd\u003e139\u003c/td\u003e\n\u003ctd\u003eTCP\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSamba2\u003c/td\u003e\n\u003ctd\u003e192.168.1.10\u003c/td\u003e\n\u003ctd\u003e445\u003c/td\u003e\n\u003ctd\u003e445\u003c/td\u003e\n\u003ctd\u003eTCP\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003col start=\"3\"\u003e\n\u003cli\u003e外网设备通过「外网IP+共享名称」访问（例如\u003ccode\u003e\\\\220.181.XX.XX\\share\u003c/code\u003e）。\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch2 id=\"八、常见问题排查\"\u003e\u003ca href=\"#八、常见问题排查\" class=\"headerlink\" title=\"八、常见问题排查\"\u003e\u003c/a\u003e八、常见问题排查\u003c/h2\u003e\u003ch3 id=\"1-访问被拒绝（NT-STATUS-ACCESS-DENIED）\"\u003e\u003ca href=\"#1-访问被拒绝（NT-STATUS-ACCESS-DENIED）\" class=\"headerlink\" title=\"1. 访问被拒绝（NT_STATUS_ACCESS_DENIED）\"\u003e\u003c/a\u003e1. 访问被拒绝（\u003ccode\u003eNT_STATUS_ACCESS_DENIED\u003c/code\u003e）\u003c/h3\u003e\u003cp\u003e如果出现访问被拒绝的情况，检查目录权限并重新设置：\u003c/p\u003e\n\u003cfigure class=\"highlight bash\"\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd class=\"gutter\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e1\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e2\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e3\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e4\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e5\u003c/span\u003e\u003cbr\u003e\u003c/pre\u003e\u003c/td\u003e\u003ctd class=\"code\"\u003e\u003cpre\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"comment\"\u003e# 检查目录权限\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"built_in\"\u003els\u003c/span\u003e -ld /data/storage/share\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\u003e\u003cspan class=\"comment\"\u003e# 重新设置权限\u003c/span\u003e\u003c/span\u003e\u003cbr\u003e\u003cspan class=\"line\"\ m: 25%;\"\u003e\n\n\u003ch3 id=\"3-内存（RAM）\"\u003e\u003ca href=\"#3-内存（RAM）\" class=\"headerlink\" title=\"3. 内存（RAM）\"\u003e\u003c/a\u003e3. 内存（RAM）\u003c/h3\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e参数\u003c/th\u003e\n\u003cth\u003e详情\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e品牌与型号\u003c/td\u003e\n\u003ctd\u003e影驰（GALAX）DDR4-2400 4G（具体型号可参考硬件标识，如GALAX DDR4 2400U 4G）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e规格参数\u003c/td\u003e\n\u003ctd\u003eDDR4类型，容量4GB，频率2400MHz（PC4-19200），时序通常为17-17-17-39，电压1.2V\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e实际使用表现\u003c/td\u003e\n\u003ctd\u003e系统空闲时内存占用约500-600MB；同时运行“浏览器（10个标签页）+ Word + 微信”时，占用约2.5-3GB，剩余内存不足1GB，多任务易卡顿，建议升级至8GB（2×4GB双通道）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e升级建议\u003c/td\u003e\n\u003ctd\u003e优先选择同品牌、同频率DDR4 2400 4G内存，避免因兼容性导致蓝屏；若预算充足，可直接更换为DDR4 2666 8G（主板向下兼容）\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cimg src=\"/2025/10/01/%E7%94%B5%E8%84%91%E8%AE%BE%E5%A4%87/%E4%B8%AD%E8%BE%BE%E5%8F%B0%E5%BC%8F%E7%94%B5%E8%84%91%E5%AE%8C%E6%95%B4%E9%85%8D%E7%BD%AE%E4%BF%A1%E6%81%AF%E6%95%B4%E7%90%86/1759849452638.jpg\" style=\"zoom:25%;\"\u003e\n\n\u003ch3 id=\"4-集成显卡（CPU内置）\"\u003e\u003ca href=\"#4-集成显卡（CPU内置）\" class=\"headerlink\" title=\"4. 集成显卡（CPU内置）\"\u003e\u003c/a\u003e4. 集成显卡（CPU内置）\u003c/h3\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e参数\u003c/th\u003e\n\u003cth\u003e详情\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e型号\u003c/td\u003e\n\u003ctd\u003eAMD Radeon R7 Graphics（集成于AMD A8-9600处理器）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e核心参数\u003c/td\u003e\n\u003ctd\u003e核心频率约800MHz，共享系统内存（最大可分配2GB，依赖物理内存容量）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e接口与分辨率\u003c/td\u003e\n\u003ctd\u003e支持HDMI、VGA接口（需主板提供对应接口），最大输出分辨率1920×1080@60Hz（高清）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e性能定位\u003c/td\u003e\n\u003ctd\u003e满足日常图形需求：如1080P视频播放、PPT演示、网页动画渲染；无法运行3D游戏（如《原神》《绝地求生》）或专业设计软件（如AutoCAD、Pr）\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch2 id=\"三、存储设备\"\u003e\u003ca href=\"#三、存储设备\" class=\"headerlink\" title=\"三、存储设备\"\u003e\u003c/a\u003e三、存储设备\u003c/h2\u003e\u003ch3 id=\"1-机械硬盘（数据-系统盘）\"\u003e\u003ca href=\"#1-机械硬盘（数据-系统盘）\" class=\"headerlink\" title=\"1. 机械硬盘（数据/系统盘）\"\u003e\u003c/a\u003e1. 机械硬盘（数据/系统盘）\u003c/h3\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e参数\u003c/th\u003e\n\u003cth\u003e详情\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e品牌型号\u003c/td\u003e\n\u003ctd\u003e西部数据（WD）Blue 1TB（具体型号：WD10EZEX）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e规格参数\u003c/td\u003e\n\u003ctd\u003eSATA III接口（向下兼容SATA II），容量1TB，缓存64MB，转速7200转/分钟\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e性能特点\u003c/td\u003e\n\u003ctd\u003e西部数据“蓝盘”系列，主打稳定性与性价比，适合存储大容量数据（如照片、视频、文档）；作为系统盘时，Windows 10启动时间约40-50秒，读取速度约150-180MB/s\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e使用建议\u003c/td\u003e\n\u003ctd\u003e若作为系统盘，建议分区为“C盘（100GB，装系统）+ D盘（剩余容量，存数据）”；若追求更快启动速度，可加装120GB及以上SATA III SSD作为系统盘，机械硬盘仅存数据\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e维护提示\u003c/td\u003e\n\u003ctd\u003e避免剧烈震动（运行时震动易导致坏道），定期用“WD Dashboard”检测硬盘健康状态，预防数据丢失\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cimg src=\"/2025/10/01/%E7%94%B5%E8%84%91%E8%AE%BE%E5%A4%87/%E4%B8%AD%E8%BE%BE%E5%8F%B0%E5%BC%8F%E7%94%B5%E8%84%91%E5%AE%8C%E6%95%B4%E9%85%8D%E7%BD%AE%E4%BF%A1%E6%81%AF%E6%95%B4%E7%90%86/1759849452407.jpg\" style=\"zoom:25%;\"\u003e\n\n\u003ch2 id=\"四、外部设备与电源\"\u003e\u003ca href=\"#四、外部设备与电源\" class=\"headerlink\" title=\"四、外部设备与电源\"\u003e\u003c/a\u003e四、外部设备与电源\u003c/h2\u003e\u003ch3 id=\"1-光驱\"\u003e\u003ca href=\"#1-光驱\" class=\"headerlink\" title=\"1. 光驱\"\u003e\u003c/a\u003e1. 光驱\u003c/h3\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e参数\u003c/th\u003e\n\u003cth\u003e详情\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e品牌型号\u003c/td\u003e\n\u003ctd\u003eLG DH18NS61 DVD-ROM\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e功能与规格\u003c/td\u003e\n\u003ctd\u003e仅支持DVD/CD读取（不支持刻录），读取速度：DVD最高18倍速（约27MB/s）、CD最高48倍速（约7.2MB/s）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e接口类型\u003c/td\u003e\n\u003ctd\u003eSATA接口（需连接主板SATA接口及电源）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e使用场景\u003c/td\u003e\n\u003ctd\u003e仅适用于读取老式DVD安装盘（如系统盘、软件安装盘）或CD音频碟；当前主流场景（如下载软件、在线安装系统）中使用率较低，可根据需求保留或拆除（节省机箱空间）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e生产与认证\u003c/td\u003e\n\u003ctd\u003e符合RoHS环保标准，通常支持Windows/Linux系统自动识别，无需额外安装驱动\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cimg src=\"/2025/10/01/%E7%94%B5%E8%84%91%E8%AE%BE%E5%A4%87/%E4%B8%AD%E8%BE%BE%E5%8F%B0%E5%BC%8F%E7%94%B5%E8%84%91%E5%AE%8C%E6%95%B4%E9%85%8D%E7%BD%AE%E4%BF%A1%E6%81%AF%E6%95%B4%E7%90%86/1759849452459.jpg\" style=\"zoom:25%;\"\u003e\n\n\u003ch3 id=\"2-显示器\"\u003e\u003ca href=\"#2-显示器\" class=\"headerlink\" title=\"2. 显示器\"\u003e\u003c/a\u003e2. 显示器\u003c/h3\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e参数\u003c/th\u003e\n\u003cth\u003e详情\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e品牌型号\u003c/td\u003e\n\u003ctd\u003e大华（dahua）DHL22-H800 液晶监视器\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e规格参数\u003c/td\u003e\n\u003ctd\u003e屏幕尺寸22英寸，显示比例16:9，分辨率通常为1920×1080（1080P），面板类型多为TN（响应速度快，可视角度中等）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e显示效果\u003c/td\u003e\n\u003ctd\u003e亮度约250cd/m²，对比度1000:1，支持亮度/对比度调节，适合办公场景（如长时间看文档），色彩表现满足日常需求，不适合专业色彩校准（如摄影修图）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e接口与供电\u003c/td\u003e\n\u003ctd\u003e支持VGA、HDMI接口（需确认具体机型），电源输入：AC 100-240V 50/60Hz，功耗约25W\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e使用注意事项\u003c/td\u003e\n\u003ctd\u003e作为“监视器”，刷新率通常为60Hz，无高刷需求（如游戏）；建议每使用1小时休息10分钟，延长屏幕寿命\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch3 id=\"3-电源\"\u003e\u003ca href=\"#3-电源\" class=\"headerlink\" title=\"3. 电源\"\u003e\u003c/a\u003e3. 电源\u003c/h3\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e参数\u003c/th\u003e\n\u003cth\u003e详情\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e品牌型号\u003c/td\u003e\n\u003ctd\u003e核霸（HARBUA）RP-410 白金版\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e类型与规格\u003c/td\u003e\n\u003ctd\u003eATX 2.31标准开关电源，适配ATX版型主板（含独立显卡主板），额定功率通常为300-350W（具体以铭牌为准）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e电气参数\u003c/td\u003e\n\u003ctd\u003e输入：AC 220V 5A 50Hz；输出：+12V（18A，约216W）、+5V（16A，约80W）、+3.3V（16A，约52.8W）、-12V（0.3A）、+5VSB（2A）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e兼容性与升级\u003c/td\u003e\n\u003ctd\u003e额定功率300-350W，可支持“AMD A8-9600 + 入门级独显（如GTX 1650 4G）”组合；若升级更高功耗显卡（如RTX 3050），需更换额定400W及以上电源\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e安全与认证\u003c/td\u003e\n\u003ctd\u003e通常通过CCC中国强制认证，内置过压、过流、短路保护；建议定期检查电源风扇是否积灰，避免因散热不良导致电源故障\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cimg src=\"/2025/10/01/%E7%94%B5%E8%84%91%E8%AE%BE%E5%A4%87/%E4%B8%AD%E8%BE%BE%E5%8F%B0%E5%BC%8F%E7%94%B5%E8%84%91%E5%AE%8C%E6%95%B4%E9%85%8D%E7%BD%AE%E4%BF%A1%E6%81%AF%E6%95%B4%E7%90%86/1759849451927.jpg\" style=\"zoom:25%;\"\u003e\n\n\u003ch2 id=\"五、使用建议与升级方向\"\u003e\u003ca href=\"#五、使用建议与升级方向\" class=\"headerlink\" title=\"五、使用建议与升级方向\"\u003e\u003c/a\u003e五、使用建议与升级方向\u003c/h2\u003e\u003ch3 id=\"1-用途定位\"\u003e\u003ca href=\"#1-用途定位\" class=\"headerlink\" title=\"1. 用途定位\"\u003e\u003c/a\u003e1. 用途定位\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e适合场景\u003c/strong\u003e：基础办公（Word/Excel/PPT）、网页浏览、1080P视频播放、轻度社交（微信/QQ）。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e不适合场景\u003c/strong\u003e：3D游戏、视频剪辑（Pr/Ae）、大型设计软件（AutoCAD、SolidWorks）、多开虚拟机。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"2-优先升级项（提升体验最明显）\"\u003e\u003ca href=\"#2-优先升级项（提升体验最明显）\" class=\"headerlink\" title=\"2. 优先升级项（提升体验最明显）\"\u003e\u003c/a\u003e2. 优先升级项（提升体验最明显）\u003c/h3\u003e\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e内存升级\u003c/strong\u003e：从4GB升级至8GB（2×4GB DDR4 2400双通道），预算约100-150元，可显著缓解多任务卡顿问题（如同时运行浏览器+办公软件+微信时，内存占用控制在3-4GB，剩余空间充足）。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e加装SSD\u003c/strong\u003e：加装120GB SATA III SSD（如金士顿A400、影驰擎），预算约80-120元，作为系统盘可将Windows启动时间从40-50秒缩短至10-15秒，软件加载速度提升2-3倍。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"3-注意事项\"\u003e\u003ca href=\"#3-注意事项\" class=\"headerlink\" title=\"3. 注意事项\"\u003e\u003c/a\u003e3. 注意事项\u003c/h3\u003e\u003cul\u003e\n\u003cli\u003e主板为AM4接口，若后续升级处理器，最高可支持AMD Ryzen 5 5600G（需更新主板BIOS），但需结合电源功率（建议400W以上）；\u003c/li\u003e\n\u003cli\u003e独立显卡升级需确认电源额定功率，避免功率不足导致死机；\u003c/li\u003e\n\u003cli\u003e硬件更换时需断电操作，避免静电损坏（可佩戴防静电手环，或触摸金属机箱释放静电）。\u003c/li\u003e\n\u003c/ul\u003e\n\n      \n    ","excerpt":"一、基础设备信息\n\n\n项目\n详情\n\n\n\n设备类型\n台式计算机（AMD A8-9600平台）\n\n\n备注\n核心硬件以AMD A8-9600处理器为核心，搭配DDR4内存及SATA存储\n\n\n二、核心硬件配置1. 处理器（CPU）\n\n\n参数\n详情\n\n\n\n品牌型号\nAMD A8-9600\n\n\n核心规格\n4核，主频3.10GHz（支持动态频率调节），集成AMD Radeon R7 Graphics显卡\n\n\n制"},{"slug":"2025/10/01/电脑设备/老一体式电脑完整配置信息整理","title":"老一体式（联想IdeaCentre B305）电脑完整配置信息整理","date":"2025-09-30T16:00:00.000Z","formattedDate":"2025年10月01日","category":"电脑设备","content":"\n      \n        \u003cp\u003e本文档基于硬件标识图片与原始配置信息，整合联想IdeaCentre B305老一体式电脑的核心参数、设备状态及使用建议，为硬件维护或升级提供参考。\u003c/p\u003e\n\u003ch2 id=\"一、基础设备信息\"\u003e\u003ca href=\"#一、基础设备信息\" class=\"headerlink\" title=\"一、基础设备信息\"\u003e\u003c/a\u003e一、基础设备信息\u003c/h2\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e项目\u003c/th\u003e\n\u003cth\u003e详情\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e设备型号\u003c/td\u003e\n\u003ctd\u003e联想 IdeaCentre B305 微型计算机\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e生产日期\u003c/td\u003e\n\u003ctd\u003e2011年06月20日\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e出厂编号/批号\u003c/td\u003e\n\u003ctd\u003e出厂编号：WS80282379；批号：WS010620AA\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e生产厂家\u003c/td\u003e\n\u003ctd\u003e联想(北京)有限公司，中国制造\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e保修服务\u003c/td\u003e\n\u003ctd\u003e三年有限保修，一年上门服务（S\u0026amp;E），官方服务网址：\u003ca target=\"_blank\" rel=\"noopener\" href=\"http://support.lenovo.com.cn/\"\u003ehttp://support.lenovo.com.cn\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e电源规格\u003c/td\u003e\n\u003ctd\u003e直流输入 19.5V === 6.7A\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch2 id=\"二、核心硬件配置\"\u003e\u003ca href=\"#二、核心硬件配置\" class=\"headerlink\" title=\"二、核心硬件配置\"\u003e\u003c/a\u003e二、核心硬件配置\u003c/h2\u003e\u003ch3 id=\"1-处理器（CPU）\"\u003e\u003ca href=\"#1-处理器（CPU）\" class=\"headerlink\" title=\"1. 处理器（CPU）\"\u003e\u003c/a\u003e1. 处理器（CPU）\u003c/h3\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e参数\u003c/th\u003e\n\u003cth\u003e详情\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e品牌型号\u003c/td\u003e\n\u003ctd\u003eAMD Sempron（闪龙）SDX180HDK22GM\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e核心规格\u003c/td\u003e\n\u003ctd\u003eK10架构，双核单线程，主频2.40GHz，1MB L2缓存\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e制程与功耗\u003c/td\u003e\n\u003ctd\u003e45nm制程工艺，TDP（热设计功耗）45W\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e性能定位\u003c/td\u003e\n\u003ctd\u003e入门级处理器，仅支持基础办公（文档编辑、简单网页浏览），多任务或大型文件运行易卡顿\u003c/td\u003e\n\u003c/tr\u003e\n =\"headerlink\" title=\"2. 硬件升级与维护建议\"\u003e\u003c/a\u003e2. 硬件升级与维护建议\u003c/h3\u003e\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e优先升级项\u003c/strong\u003e：\u003cul\u003e\n\u003cli\u003e存储：更换120GB及以上SATA III SSD（如金士顿A400、三星860 EVO），提升系统启动与文件读取速度\u003c/li\u003e\n\u003cli\u003e内存：升级至2×2GB DDR3 1333MHz SO-DIMM内存（共4GB），缓解多任务内存不足问题\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e注意事项\u003c/strong\u003e：\u003cul\u003e\n\u003cli\u003e一体机硬件为定制化设计，兼容性与台式机通用硬件有差异，升级前需确认接口与尺寸匹配（如内存需笔记本专用SO-DIMM类型）\u003c/li\u003e\n\u003cli\u003e光驱目前使用率较低，若无需读取老式光盘，可忽略维护；若需使用，需外接测试硬件状态\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e用途限制\u003c/strong\u003e：\u003cul\u003e\n\u003cli\u003e升级后仍仅适合基础办公（文档、网页）、影音播放，无法满足游戏、视频剪辑等高性能需求\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\n      \n    ","excerpt":"本文档基于硬件标识图片与原始配置信息，整合联想IdeaCentre B305老一体式电脑的核心参数、设备状态及使用建议，为硬件维护或升级提供参考。\n一、基础设备信息\n\n\n项目\n详情\n\n\n\n设备型号\n联想 IdeaCentre B305 微型计算机\n\n\n生产日期\n2011年06月20日\n\n\n出厂编号/批号\n出厂编号：WS80282379；批号：WS010620AA\n\n\n生产厂家\n联想(北京)有限公司"}]},"__N_SSG":true},"page":"/categories/[category]","query":{"category":"电脑设备"},"buildId":"sI-u7AVjkVsRqUv2lH91Y","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
